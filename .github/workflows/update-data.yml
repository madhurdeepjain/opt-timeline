name: Update timeline data

# Runs the scraper on a schedule and writes results to Supabase.
# No data is committed back to the repo — Supabase is the source of truth.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # manual trigger

permissions:
  contents: read
  issues: write # to open an issue when a new megathread shows up

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Reddit's rate limit (~100 requests / 10 min) makes a full fetch take ~20 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run scraper → Supabase
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REDDIT_COOKIE: ${{ secrets.REDDIT_COOKIE }}
        run: |
          uv sync
          uv run python -m unittest discover -s tests  # a broken parser must not write data
          uv run scrape --yes

      - name: Look for new megathreads
        working-directory: scraper
        continue-on-error: true # never fail the data update over this
        env:
          REDDIT_COOKIE: ${{ secrets.REDDIT_COOKIE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep only the result bullets (progress/rate-limit logs also go to stdout)
          found="$(uv run scrape --check-threads | grep '^- \[' || true)"
          [ -z "$found" ] && exit 0
          title="New OPT timeline megathreads to review"
          body="$(printf '%s\n\n%s\n' \
            'Found by the daily scrape. Add relevant ones to `THREADS` (scraper/src/reddit_opt_scraper/config.py) and `THREAD_OPTIONS` (dashboard/src/lib/types.ts); add irrelevant ones to `IGNORED_THREADS` in config.py.' \
            "$found")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
